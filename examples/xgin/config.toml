# xgin 示例配置
# 运行：go run . --config=config.toml
# 注意：多词键名须用 camelCase 才能绑定到 Config 字段（jupiter 的 conf 按
# 字段名大小写不敏感匹配，不处理下划线）。
[server.gin]
host = "0.0.0.0"
port = 9091
mode = "release"                      # release / debug / test
disableMetric = false                 # true 时关闭内置 Prometheus 指标中间件
slowQueryThresholdInMilli = 500       # 访问日志慢查询阈值（毫秒），0 关闭
# serviceAddress = "10.0.0.1:8080"    # 注册信息中上报的地址，默认 host:port

# 超时控制（0 表示不限制；readTimeout 同时用作读 header 超时）
readTimeout = "30s"
writeTimeout = "30s"
idleTimeout = "60s"

# CORS 默认开启且全部授权；如需关闭可设 disableCORS = true
disableCORS = false
[server.gin.cors]
allowAllOrigins = true
allowMethods = ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS"]
allowHeaders = ["Origin", "Content-Length", "Content-Type", "Authorization", "X-Requested-With"]
exposeHeaders = ["Content-Length"]
allowCredentials = false
maxAge = "12h"

# governor 管理端口
[server.governor]
host = "0.0.0.0"
port = 9093
